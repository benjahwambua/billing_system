name: PHP Syntax Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Lint PHP files
        shell: bash
        run: |
          set -e
          failed=0
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            if ! php -l "$file"; then
              failed=1
            fi
          done < <(find . -type f -name '*.php' -not -path './.git/*' -print0)
          exit "$failed"

      - name: Run SMS endpoint security regression tests
        run: php tests/security_sms_endpoint_policy.php

      - name: Run invoice amount regression tests
        run: php tests/billing_amount_regressions.php

      - name: Run M-Pesa callback policy regression tests
        run: php tests/mpesa_callback_policy.php

      - name: Run service activation retry regression tests
        run: php tests/service_activation_retry_policy.php

      - name: Run manual payment input regression tests
        run: php tests/payment_input_validation.php

      - name: Run internet account status regression tests
        run: php tests/internet_account_status_policy.php

      - name: Run hotspot package status regression tests
        run: php tests/hotspot_package_policy.php
